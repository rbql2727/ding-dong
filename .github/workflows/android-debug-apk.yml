# 안드로이드 디버그 APK 를 GitHub 클라우드에서 빌드합니다.
#
# 처음 한 번 준비:
#   GitHub 저장소 → Settings → Secrets and variables → Actions → New repository secret
#     VITE_SUPABASE_URL       Supabase 프로젝트 주소
#     VITE_SUPABASE_ANON_KEY  publishable(anon) 키  ※ service_role/secret 키는 절대 넣지 말 것
#     VITE_PUBLIC_SITE_URL    (선택) 웹 배포 주소 — 공유 링크용
#
# 실행: 저장소 → Actions → "Android 디버그 APK" → Run workflow
#       (main 브랜치에 올릴 때도 자동 실행)
# 결과: 실행 화면 아래 Artifacts 의 "ocwk-debug-apk" 를 내려받아 압축을 풀면 app-debug.apk

name: Android 디버그 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'supabase/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 패키지 설치
        run: npm ci

      - name: Supabase 키 확인
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::저장소 Settings → Secrets and variables → Actions 에 VITE_SUPABASE_URL 과 VITE_SUPABASE_ANON_KEY 를 넣어 주세요."
            exit 1
          fi

      - name: 웹 빌드
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_SITE_URL: ${{ secrets.VITE_PUBLIC_SITE_URL }}
        run: npm run build

      - name: Java 21 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 안드로이드 프로젝트에 웹 반영
        run: npx cap sync android

      - name: APK 빌드
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: ocwk-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
